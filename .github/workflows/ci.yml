name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: ['1.3.10', 'latest']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate the module
        run: terraform init -backend=false -input=false && terraform validate

      - name: Validate the example
        working-directory: examples/basic
        run: terraform init -backend=false -input=false && terraform validate

      # Mocked providers (Terraform 1.9+); tests/live_index.tftest.hcl reads the live index.
      - name: Tests
        if: matrix.terraform == 'latest'
        run: terraform test

  opentofu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2
        with:
          tofu_wrapper: false

      # tests/ holds terraform test files that use Terraform-only syntax (state_key, functions
      # in overrides): point OpenTofu to a missing test directory.
      - name: Validate the module and the example
        run: |
          tofu init -backend=false -input=false -test-directory=no-tests
          tofu validate -test-directory=no-tests
          cd examples/basic && tofu init -backend=false -input=false && tofu validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact
